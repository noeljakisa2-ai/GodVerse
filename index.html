<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#91bfd1"><title>GodVerse — Living Landscape</title>
<style>
*{box-sizing:border-box}html,body,#world{margin:0;width:100%;height:100%;overflow:hidden}body{font:14px system-ui;background:#91bfd1;color:#f4f2e8}canvas{display:block}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;pointer-events:none;text-shadow:0 2px 8px #203329}.brand{font-weight:900;letter-spacing:.22em}.brand small{display:block;font-size:9px;letter-spacing:.18em;color:#f0e7d0}.status{background:#14251dbd;border:1px solid #ffffff35;border-radius:30px;padding:8px 11px;font-size:10px;letter-spacing:.12em}
.hint{position:fixed;right:14px;bottom:14px;background:#14251dbd;border:1px solid #ffffff30;border-radius:9px;padding:8px 10px;font-size:10px;color:#e5eadf;pointer-events:none}
@media(max-width:650px){header{padding:11px}.hint{right:8px;bottom:8px;font-size:9px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="world"></div>
<header><div class="brand">GODVERSE<small>THE LIVING LANDSCAPE</small></div><div class="status" id="status">● LANDSCAPE READY</div></header>
<div class="hint">Drag to look • Pinch / scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const mobile=matchMedia('(max-width:760px),(pointer:coarse)').matches;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91bfd1);scene.fog=new THREE.Fog(0x91bfd1,155,360);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,500);camera.position.set(38,38,48);
const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1:1.35));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=!mobile;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#world').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,4,0);controls.enableDamping=true;controls.minPolarAngle=.12;controls.maxPolarAngle=1.38;controls.minDistance=18;controls.maxDistance=92;
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x536044,2));const sun=new THREE.DirectionalLight(0xffe2b0,2.6);sun.position.set(-35,55,25);sun.castShadow=!mobile;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const world=new THREE.Group();scene.add(world);const skyGroup=new THREE.Group();scene.add(skyGroup);
const block=new THREE.BoxGeometry(1,1,1);
const materials={
grass:new THREE.MeshStandardMaterial({color:0x7f9849,roughness:1}),savanna:new THREE.MeshStandardMaterial({color:0xb5a45c,roughness:1}),
forest:new THREE.MeshStandardMaterial({color:0x426b42,roughness:1}),sand:new THREE.MeshStandardMaterial({color:0xc8a36d,roughness:1}),
rock:new THREE.MeshStandardMaterial({color:0x777b72,roughness:1}),soil:new THREE.MeshStandardMaterial({color:0x79583b,roughness:1}),
snow:new THREE.MeshStandardMaterial({color:0xe5e6dc,roughness:1}),water:new THREE.MeshStandardMaterial({color:0x347f9a,roughness:.2,metalness:.15,transparent:true,opacity:.88}),
trunk:new THREE.MeshStandardMaterial({color:0x60432b,roughness:1}),leaf1:new THREE.MeshStandardMaterial({color:0x486b3d,roughness:1}),leaf2:new THREE.MeshStandardMaterial({color:0x718b43,roughness:1}),leaf3:new THREE.MeshStandardMaterial({color:0x315a39,roughness:1})
};
const cell=1.4,half=70,cols=101,topInstances={grass:[],savanna:[],forest:[],sand:[],rock:[],snow:[]},soilInstances=[];
function biome(x,z){
 // Wavy boundaries break up straight biome borders and create more organic terrain regions.
 const edgeA=Math.sin(z*.105)*3.8+Math.sin(z*.037+1.4)*2.4;
 const edgeB=Math.sin(x*.09+2)*3.2+Math.cos(x*.045)*2.1;
 if(x>18+edgeA&&z<-10+edgeB)return 'desert';
 if(x<-18+edgeA&&z<4+edgeB)return 'forest';
 if(x<-16+edgeA&&z>15+edgeB)return 'wetland';
 if(x>14+edgeA&&z>15+edgeB)return 'highland';
 if(Math.abs(x)>39+edgeA||Math.abs(z)>39+edgeB)return 'shore';
 return 'savanna'
}
function rawHeight(x,z){let h=2.2+Math.sin(x*.095)*1.2+Math.cos(z*.11)*1.05+Math.sin((x+z)*.065)*1.2;h+=Math.max(0,1-Math.hypot(x+23,z-21)/22)*11;h+=Math.max(0,1-Math.hypot(x-25,z+22)/19)*8;h+=Math.max(0,1-Math.hypot(x-2,z-30)/13)*5;return h}
const riverPts=[[-47,-19],[-34,-14],[-23,-8],[-14,-2],[-5,5],[5,11],[14,17],[24,25],[39,34]].map(([x,z])=>new THREE.Vector3(x,0,z));
const curve=new THREE.CatmullRomCurve3(riverPts);
function riverDistance(x,z){let best=1e9;for(let i=0;i<riverPts.length-1;i++){const a=riverPts[i],b=riverPts[i+1],dx=b.x-a.x,dz=b.z-a.z,t=THREE.MathUtils.clamp(((x-a.x)*dx+(z-a.z)*dz)/(dx*dx+dz*dz),0,1);best=Math.min(best,Math.hypot(x-a.x-t*dx,z-a.z-t*dz))}return best}
function heightAt(x,z){let h=rawHeight(x,z);const b=biome(x,z);if(b==='desert')h-=.8;if(b==='wetland')h-=1;const d=riverDistance(x,z);if(d<3.4)h-=2.1*(1-d/3.4);return Math.max(.2,Math.round(h/1.15)*1.15)}
const dummy=new THREE.Object3D();
for(let ix=0;ix<cols;ix++)for(let iz=0;iz<cols;iz++){
 const x=(ix-cols/2)*cell,z=(iz-cols/2)*cell,b=biome(x,z),h=heightAt(x,z),levels=Math.max(1,Math.round(h));
 let top=b==='desert'?'sand':b==='forest'?'forest':b==='highland'&&h>10?'rock':b==='shore'?'sand':b==='wetland'?'grass':'savanna';
 if(b==='highland'&&h>13)top='snow';
 dummy.position.set(x,h-.5,z);dummy.scale.set(cell,1,cell);dummy.updateMatrix();topInstances[top].push(dummy.matrix.clone());
 for(let y=1;y<levels;y++){dummy.position.set(x,y-.5,z);dummy.scale.set(cell,1,cell);dummy.updateMatrix();soilInstances.push(dummy.matrix.clone())}
}
function instanced(material,matrices){const m=new THREE.InstancedMesh(block,materials[material],matrices.length);matrices.forEach((v,i)=>m.setMatrixAt(i,v));m.instanceMatrix.needsUpdate=true;m.castShadow=!mobile;m.receiveShadow=true;world.add(m);return m}
for(const [name,arr] of Object.entries(topInstances))if(arr.length)instanced(name,arr);
instanced('soil',soilInstances);
// Broad ground continuation hides the exposed underside at the terrain boundary.
// It extends beyond the camera fog so the world reads as continuous land, not a floating tile.
const worldBase=new THREE.Mesh(new THREE.PlaneGeometry(620,620),materials.savanna);
worldBase.rotation.x=-Math.PI/2;
worldBase.position.y=-.08;
worldBase.receiveShadow=true;
world.add(worldBase);
// Broad, stepped voxel mountains replace the old cone-shaped spike silhouettes.
function addVoxelMountain(cx,cz,baseRadius,tiers){
 const rockBlocks=[],snowBlocks=[];
 for(let tier=0;tier<tiers;tier++){
  const radius=Math.max(2.1,baseRadius-tier*.9);
  for(let ix=0;ix<cols;ix++)for(let iz=0;iz<cols;iz++){
   const x=(ix-cols/2)*cell,z=(iz-cols/2)*cell;
   const dx=x-cx,dz=z-cz;
   if(Math.hypot(dx,dz)>radius)continue;
   dummy.position.set(x,heightAt(x,z)+tier+.52,z);
   dummy.scale.set(cell,1.08,cell);dummy.rotation.set(0,0,0);dummy.updateMatrix();
   (tier>=tiers-2?snowBlocks:rockBlocks).push(dummy.matrix.clone());
  }
 }
 if(rockBlocks.length)instancedMountain('rock',rockBlocks);
 if(snowBlocks.length)instancedMountain('snow',snowBlocks);
}
function instancedMountain(material,matrices){
 const mesh=new THREE.InstancedMesh(block,materials[material],matrices.length);
 matrices.forEach((matrix,i)=>mesh.setMatrixAt(i,matrix));
 mesh.instanceMatrix.needsUpdate=true;mesh.castShadow=!mobile;mesh.receiveShadow=true;world.add(mesh);
}
addVoxelMountain(-23.8,21,10.5,8);
addVoxelMountain(25.2,-22.4,9.5,7);
addVoxelMountain(2.8,30.8,7.5,6);
// Voxel trees: squared trunks and layered block canopies, varied silhouettes.
function tree(x,z,type){
 const y=heightAt(x,z),g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.BoxGeometry(.52,2.7,.52),materials.trunk);trunk.position.y=1.35;g.add(trunk);
 const limb=(w,h,d,px,py,pz,mat)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(px,py,pz);g.add(m)};
 if(type==='acacia'){
  limb(.34,1.45,.34,0,2.8,0,materials.trunk);
  // Broad, uneven umbrella crown with separate lobes and visible branch arms.
  limb(1.65,.28,.3,-.85,3.35,0,materials.trunk);limb(1.55,.28,.3,.82,3.35,.05,materials.trunk);
  limb(2.5,.65,2.15,-.9,3.85,0,materials.leaf2);
  limb(2.15,.58,2.25,1.0,3.9,.05,materials.leaf1);
  limb(1.45,.48,1.55,.05,4.15,-.05,materials.leaf2);
 }else{
  const foliage=type==='forest'?materials.leaf3:materials.leaf1;
  const tiers=3+Math.floor(Math.random()*2),spread=1.9+Math.random()*.8;
  for(let k=0;k<tiers;k++){
   const width=spread*(1-k*.19),depth=spread*(1-k*.17),height=1.35+Math.random()*.45;
   limb(width,height,depth,(Math.random()-.5)*.3,2.35+k*1.05,(Math.random()-.5)*.3,k%2?materials.leaf2:foliage);
  }
  // Short blocky side branches keep the silhouette from looking like a perfect stack.
  for(let side of [-1,1])limb(.75,.42,.55,side*.82,2.85+Math.random()*.8,0,foliage);
 }
 g.position.set(x,y,z);g.rotation.y=Math.random()*Math.PI*2;g.scale.setScalar(.82+Math.random()*.42);
 g.traverse(o=>{if(o.isMesh)o.castShadow=!mobile});world.add(g)
}
for(let i=0;i<(mobile?70:125);i++){const x=(Math.random()-.5)*88,z=(Math.random()-.5)*88,b=biome(x,z);if(Math.hypot(x,z)<7||Math.hypot(x-7,z-15)<8)continue;tree(x,z,b==='forest'?'forest':'acacia')}
// Layered voxel-friendly grass tufts: broad tapered blades instead of thin square sticks.
const bladeShape=new THREE.Shape();bladeShape.moveTo(-.16,0);bladeShape.quadraticCurveTo(-.12,.42,0,.82);bladeShape.quadraticCurveTo(.18,.38,.16,0);bladeShape.close();
const grassGeo=new THREE.ShapeGeometry(bladeShape);
const grassMat=new THREE.MeshStandardMaterial({color:0x8b9d4e,roughness:1,side:THREE.DoubleSide});
const grassCount=mobile?1050:2500;
const grassA=new THREE.InstancedMesh(grassGeo,grassMat,grassCount),grassB=new THREE.InstancedMesh(grassGeo,grassMat,grassCount);
const grassPalette=[new THREE.Color(0x738c3e),new THREE.Color(0x8da34b),new THREE.Color(0xa0a957),new THREE.Color(0x627d39)];
for(let i=0;i<grassCount;i++){
 let x,z,b,tries=0;
 do{x=(Math.random()-.5)*94;z=(Math.random()-.5)*94;b=biome(x,z);tries++}while(tries<8&&(b==='desert'||b==='highland'||riverDistance(x,z)<3.8||Math.hypot(x,z)<7));
 const y=heightAt(x,z),h=.65+Math.random()*.75,rot=Math.random()*Math.PI*2;
 dummy.position.set(x,y+.015,z);dummy.rotation.set(0,rot,0);dummy.scale.set(.8+Math.random()*.9,h,.8+Math.random()*.9);dummy.updateMatrix();grassA.setMatrixAt(i,dummy.matrix);
 dummy.rotation.y=rot+Math.PI/2;dummy.scale.set(.7+Math.random()*.8,h*.82,.7+Math.random()*.8);dummy.updateMatrix();grassB.setMatrixAt(i,dummy.matrix);
 const shade=grassPalette[Math.floor(Math.random()*grassPalette.length)];grassA.setColorAt(i,shade);grassB.setColorAt(i,shade.clone().multiplyScalar(.88));
}
grassA.instanceMatrix.needsUpdate=true;grassB.instanceMatrix.needsUpdate=true;
if(grassA.instanceColor)grassA.instanceColor.needsUpdate=true;if(grassB.instanceColor)grassB.instanceColor.needsUpdate=true;
grassA.castShadow=!mobile;grassB.castShadow=!mobile;world.add(grassA,grassB);
// River curves through the lowlands; broad banks and a waterfall cascade.
// Reuse the river centreline defined before terrain generation so the channel is carved into the ground.
const riverMat=new THREE.MeshStandardMaterial({color:0x287d9b,roughness:.16,metalness:.08,transparent:true,opacity:.94,side:THREE.DoubleSide});
function ribbon(c,width,yOffset){const verts=[],idx=[],steps=180;for(let i=0;i<=steps;i++){const t=i/steps,p=c.getPoint(t),tan=c.getTangent(t),side=new THREE.Vector3(-tan.z,0,tan.x).normalize(),y=heightAt(p.x,p.z)+yOffset;for(const s of [-1,1]){const q=p.clone().addScaledVector(side,s*width/2);verts.push(q.x,y,q.z)}if(i<steps){const n=i*2;idx.push(n,n+1,n+2,n+1,n+3,n+2)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();const mesh=new THREE.Mesh(geo,riverMat);mesh.renderOrder=3;world.add(mesh);return mesh}
ribbon(curve,4.2,.16);
const pool=new THREE.Mesh(new THREE.BoxGeometry(8,.18,6),materials.water);pool.position.set(8,heightAt(8,15)+.02,15);world.add(pool);
const waterfall=new THREE.Group();const sheet=new THREE.Mesh(new THREE.BoxGeometry(3.4,3.8,.18),new THREE.MeshBasicMaterial({color:0x74c7d8,transparent:true,opacity:.82,side:THREE.DoubleSide}));sheet.position.y=-1.8;waterfall.add(sheet);const sideFlow=new THREE.Mesh(new THREE.BoxGeometry(.45,3.2,.22),new THREE.MeshBasicMaterial({color:0xc5edf0,transparent:true,opacity:.72}));sideFlow.position.set(-1.45,-1.55,.08);waterfall.add(sideFlow);
for(let i=0;i<5;i++){const drop=new THREE.Mesh(new THREE.BoxGeometry(.12,.55,.13),new THREE.MeshBasicMaterial({color:0xe0f5f1,transparent:true,opacity:.8}));drop.position.set((Math.random()-.5)*2.8,-Math.random()*3.3,.15);waterfall.add(drop)}
waterfall.position.set(8,heightAt(8,15)+1.9,15);world.add(waterfall);
// Clouds are soft low-poly puffs with slow drift.
const cloudMat=new THREE.MeshStandardMaterial({color:0xf3f5ef,roughness:1,transparent:true,opacity:.92});const clouds=[];
for(let i=0;i<(mobile?9:16);i++){const c=new THREE.Group();for(let j=0;j<5;j++){const puff=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),cloudMat);puff.position.set((j-2)*1.15,Math.random()*.35,Math.random()*.3);puff.scale.set(1.25,.48,.72);c.add(puff)}c.position.set((Math.random()-.5)*120,25+Math.random()*15,(Math.random()-.5)*105);c.scale.setScalar(.8+Math.random()*1.5);c.userData.drift=.2+Math.random()*.24;skyGroup.add(c);clouds.push(c)}
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(2.5,18,12),new THREE.MeshBasicMaterial({color:0xffe4a0}));sunDisc.position.set(-48,48,-72);skyGroup.add(sunDisc);
let cloudVisible=true,raining=false,raindrops=null;
function setRain(on){raining=on;if(raindrops){scene.remove(raindrops);raindrops.geometry.dispose();raindrops=null}if(on){const count=mobile?400:1100,geo=new THREE.BufferGeometry(),pos=new Float32Array(count*3);for(let i=0;i<count;i++){pos[i*3]=(Math.random()-.5)*100;pos[i*3+1]=Math.random()*38;pos[i*3+2]=(Math.random()-.5)*100}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));raindrops=new THREE.Points(geo,new THREE.PointsMaterial({color:0xd6edf5,size:.1,transparent:true,opacity:.7}));scene.add(raindrops);scene.background.set(0x718f9e);scene.fog.color.set(0x718f9e)}else{scene.background.set(0x91bfd1);scene.fog.color.set(0x91bfd1)}}
// Dashboard removed for now; world controls will return as a redesigned interface later.
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;for(const c of clouds)c.position.x+=c.userData.drift*dt;if(raindrops){const p=raindrops.geometry.attributes.position;for(let i=0;i<p.count;i++){let y=p.getY(i)-dt*19;if(y<0)y=38;p.setY(i,y)}p.needsUpdate=true}controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.querySelector('#status').textContent='● LANDSCAPE READY';
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#91bfd1"><title>GodVerse — Living Landscape</title>
<style>
*{box-sizing:border-box}html,body,#world{margin:0;width:100%;height:100%;overflow:hidden}body{font:14px system-ui;background:#91bfd1;color:#f4f2e8}canvas{display:block}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;pointer-events:none;text-shadow:0 2px 8px #203329}.brand{font-weight:900;letter-spacing:.22em}.brand small{display:block;font-size:9px;letter-spacing:.18em;color:#f0e7d0}.status{background:#14251dbd;border:1px solid #ffffff35;border-radius:30px;padding:8px 11px;font-size:10px;letter-spacing:.12em}
.panel{position:fixed;left:14px;top:75px;width:220px;padding:13px;background:#13231ddd;border:1px solid #ffffff30;border-radius:15px;backdrop-filter:blur(12px);box-shadow:0 12px 36px #10201855}.panel h2{font-size:10px;letter-spacing:.17em;color:#e8c98c;margin:0 0 10px}.panel p{font-size:11px;color:#d0d9cc;line-height:1.5;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.metric{padding:8px;background:#ffffff0d;border-radius:8px}.metric small{display:block;color:#aabaaa;font-size:9px}.metric b{font-size:13px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}button{border:1px solid #ffffff2a;background:#314637;color:#f6f1df;border-radius:8px;padding:9px 6px;font-size:10px}button.active{background:#a0804d;color:#fff4d8}#toggle{display:none}.hint{position:fixed;right:14px;bottom:14px;background:#14251dbd;border:1px solid #ffffff30;border-radius:9px;padding:8px 10px;font-size:10px;color:#e5eadf;pointer-events:none}
@media(max-width:650px){header{padding:11px}.panel{top:58px;left:8px;width:195px;padding:10px}.panel.closed{display:none}#toggle{display:block;position:fixed;left:8px;bottom:8px}.hint{right:8px;bottom:8px;font-size:9px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="world"></div>
<header><div class="brand">GODVERSE<small>THE LIVING LANDSCAPE</small></div><div class="status" id="status">● LANDSCAPE READY</div></header>
<section class="panel" id="panel"><h2>LANDSCAPE CONTROL</h2><p>A new voxel African wilderness. Explore the terrain, biomes, rivers and skies.</p>
<div class="grid"><div class="metric"><small>BIOMES</small><b>6 regions</b></div><div class="metric"><small>WORLD STYLE</small><b>Voxel 3D</b></div><div class="metric"><small>TERRAIN</small><b>Hills & peaks</b></div><div class="metric"><small>WATER</small><b>Rivers & falls</b></div></div>
<div class="controls"><button id="clouds" class="active">☁ Clouds on</button><button id="rain">🌧 Rain</button><button id="clear">☀ Clear sky</button><button id="reset">↻ Reset view</button></div></section>
<button id="toggle">☰ Landscape</button><div class="hint">Drag to look • Pinch / scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const mobile=matchMedia('(max-width:760px),(pointer:coarse)').matches;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91bfd1);scene.fog=new THREE.Fog(0x91bfd1,72,145);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,240);camera.position.set(38,34,43);
const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1:1.35));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=!mobile;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#world').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,3,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.47;controls.minDistance=12;controls.maxDistance=105;
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x536044,2));const sun=new THREE.DirectionalLight(0xffe2b0,2.6);sun.position.set(-35,55,25);sun.castShadow=!mobile;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const world=new THREE.Group();scene.add(world);const skyGroup=new THREE.Group();scene.add(skyGroup);
const block=new THREE.BoxGeometry(1,1,1);
const materials={
grass:new THREE.MeshStandardMaterial({color:0x7f9849,roughness:1}),savanna:new THREE.MeshStandardMaterial({color:0xb5a45c,roughness:1}),
forest:new THREE.MeshStandardMaterial({color:0x426b42,roughness:1}),sand:new THREE.MeshStandardMaterial({color:0xc8a36d,roughness:1}),
rock:new THREE.MeshStandardMaterial({color:0x777b72,roughness:1}),soil:new THREE.MeshStandardMaterial({color:0x79583b,roughness:1}),
snow:new THREE.MeshStandardMaterial({color:0xe5e6dc,roughness:1}),water:new THREE.MeshStandardMaterial({color:0x347f9a,roughness:.2,metalness:.15,transparent:true,opacity:.88}),
trunk:new THREE.MeshStandardMaterial({color:0x60432b,roughness:1}),leaf1:new THREE.MeshStandardMaterial({color:0x486b3d,roughness:1}),leaf2:new THREE.MeshStandardMaterial({color:0x718b43,roughness:1}),leaf3:new THREE.MeshStandardMaterial({color:0x315a39,roughness:1})
};
const cell=1.4,half=45,cols=65,topInstances={grass:[],savanna:[],forest:[],sand:[],rock:[],snow:[]},soilInstances=[];
function biome(x,z){if(x>18&&z<-10)return 'desert';if(x<-18&&z<4)return 'forest';if(x<-16&&z>15)return 'wetland';if(x>14&&z>15)return 'highland';if(Math.abs(x)>39||Math.abs(z)>39)return 'shore';return 'savanna'}
function rawHeight(x,z){let h=2.2+Math.sin(x*.095)*1.2+Math.cos(z*.11)*1.05+Math.sin((x+z)*.065)*1.2;h+=Math.max(0,1-Math.hypot(x+23,z-21)/22)*11;h+=Math.max(0,1-Math.hypot(x-25,z+22)/19)*8;h+=Math.max(0,1-Math.hypot(x-2,z-30)/13)*5;return h}
function heightAt(x,z){let h=rawHeight(x,z);const b=biome(x,z);if(b==='desert')h-=.8;if(b==='wetland')h-=1;return Math.max(1,Math.round(h/1.15)*1.15)}
const dummy=new THREE.Object3D();
for(let ix=0;ix<cols;ix++)for(let iz=0;iz<cols;iz++){
 const x=(ix-cols/2)*cell,z=(iz-cols/2)*cell,b=biome(x,z),h=heightAt(x,z),levels=Math.max(1,Math.round(h));
 let top=b==='desert'?'sand':b==='forest'?'forest':b==='highland'&&h>10?'rock':b==='shore'?'sand':b==='wetland'?'grass':'savanna';
 if(b==='highland'&&h>13)top='snow';
 dummy.position.set(x,h-.5,z);dummy.scale.set(cell,1,cell);dummy.updateMatrix();topInstances[top].push(dummy.matrix.clone());
 for(let y=1;y<levels;y++){dummy.position.set(x,y-.5,z);dummy.scale.set(cell,1,cell);dummy.updateMatrix();soilInstances.push(dummy.matrix.clone())}
}
function instanced(material,matrices){const m=new THREE.InstancedMesh(block,materials[material],matrices.length);matrices.forEach((v,i)=>m.setMatrixAt(i,v));m.instanceMatrix.needsUpdate=true;m.castShadow=!mobile;m.receiveShadow=true;world.add(m);return m}
for(const [name,arr] of Object.entries(topInstances))if(arr.length)instanced(name,arr);
instanced('soil',soilInstances);
// Mountain ridges beyond the playable valley add a clear horizon silhouette.
function ridge(x,z,scale,material){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.ConeGeometry(1,1,5),materials[material]);m.scale.set(scale,scale*1.5,scale);m.position.y=scale*.7;g.add(m);g.position.set(x,rawHeight(x,z)-.5,z);g.rotation.y=(x+z)*.03;world.add(g)}
for(let i=0;i<24;i++){const side=i%4,x=side===0?-53+i*4:side===1?53-i*4:(Math.random()-.5)*100,z=side===2?-53+i*4:side===3?53-i*4:(Math.random()-.5)*100;ridge(x,z,5+Math.random()*8,'rock')}
// Voxel trees: squared trunks and layered block canopies, varied silhouettes.
function tree(x,z,type){const y=heightAt(x,z),g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.BoxGeometry(.55,2.5,.55),materials.trunk);trunk.position.y=1.25;g.add(trunk);
 if(type==='acacia'){const stem=new THREE.Mesh(new THREE.BoxGeometry(.38,1.5,.38),materials.trunk);stem.position.y=2.7;g.add(stem);const crown=new THREE.Mesh(new THREE.BoxGeometry(4.2,.8,2.5),materials.leaf2);crown.position.y=3.7;g.add(crown);const crown2=new THREE.Mesh(new THREE.BoxGeometry(2.9,.6,2),materials.leaf1);crown2.position.y=4.15;g.add(crown2)}
 else{for(let k=0;k<3;k++){const crown=new THREE.Mesh(new THREE.BoxGeometry(2.5-k*.45,1.8,2.5-k*.45),materials[type==='forest'?'leaf3':'leaf1']);crown.position.y=2.4+k*1.2;g.add(crown)}}
 g.position.set(x,y,z);g.rotation.y=Math.random()*Math.PI*2;g.scale.setScalar(.8+Math.random()*.45);g.traverse(o=>{if(o.isMesh)o.castShadow=!mobile});world.add(g)}
for(let i=0;i<(mobile?70:125);i++){const x=(Math.random()-.5)*88,z=(Math.random()-.5)*88,b=biome(x,z);if(Math.hypot(x,z)<7||Math.hypot(x-7,z-15)<8)continue;tree(x,z,b==='forest'?'forest':'acacia')}
// Instanced grass patches, clustered in the open savanna.
const grassGeo=new THREE.BoxGeometry(.12,.55,.12),grassMat=new THREE.MeshStandardMaterial({color:0x8d9d4b,roughness:1});const grass=new THREE.InstancedMesh(grassGeo,grassMat,mobile?850:1900);
for(let i=0;i<grass.count;i++){const x=(Math.random()-.5)*88,z=(Math.random()-.5)*88,b=biome(x,z);dummy.position.set(x,heightAt(x,z)+.28,z);dummy.rotation.set(0,Math.random()*6,Math.random()*.25);dummy.scale.set(.7+Math.random(),.7+Math.random(),.7+Math.random());dummy.updateMatrix();grass.setMatrixAt(i,dummy.matrix)}world.add(grass);
// River curves through the lowlands; broad banks and a waterfall cascade.
const riverPts=[[-47,-19],[-34,-14],[-23,-8],[-14,-2],[-5,5],[5,11],[14,17],[24,25],[39,34]].map(([x,z])=>new THREE.Vector3(x,0,z));const curve=new THREE.CatmullRomCurve3(riverPts);
const riverMat=new THREE.MeshStandardMaterial({color:0x3e8da6,roughness:.2,metalness:.12,transparent:true,opacity:.9,side:THREE.DoubleSide});
function ribbon(c,width,yOffset){const verts=[],idx=[],steps=180;for(let i=0;i<=steps;i++){const t=i/steps,p=c.getPoint(t),tan=c.getTangent(t),side=new THREE.Vector3(-tan.z,0,tan.x).normalize(),y=heightAt(p.x,p.z)+yOffset;for(const s of [-1,1]){const q=p.clone().addScaledVector(side,s*width/2);verts.push(q.x,y,q.z)}if(i<steps){const n=i*2;idx.push(n,n+1,n+2,n+1,n+3,n+2)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();const mesh=new THREE.Mesh(geo,riverMat);mesh.renderOrder=3;world.add(mesh);return mesh}
ribbon(curve,3.1,.12);
const pool=new THREE.Mesh(new THREE.BoxGeometry(8,.16,6),materials.water);pool.position.set(8,heightAt(8,15)+.05,15);world.add(pool);
const waterfall=new THREE.Group();const sheet=new THREE.Mesh(new THREE.BoxGeometry(3.4,3.8,.18),new THREE.MeshBasicMaterial({color:0x9ad9e2,transparent:true,opacity:.76,side:THREE.DoubleSide}));sheet.position.y=-1.8;waterfall.add(sheet);
for(let i=0;i<5;i++){const drop=new THREE.Mesh(new THREE.BoxGeometry(.12,.55,.13),new THREE.MeshBasicMaterial({color:0xe0f5f1,transparent:true,opacity:.8}));drop.position.set((Math.random()-.5)*2.8,-Math.random()*3.3,.15);waterfall.add(drop)}
waterfall.position.set(8,heightAt(8,15)+1.9,15);world.add(waterfall);
// Clouds are soft low-poly puffs with slow drift.
const cloudMat=new THREE.MeshStandardMaterial({color:0xf3f5ef,roughness:1,transparent:true,opacity:.92});const clouds=[];
for(let i=0;i<(mobile?9:16);i++){const c=new THREE.Group();for(let j=0;j<5;j++){const puff=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),cloudMat);puff.position.set((j-2)*1.15,Math.random()*.35,Math.random()*.3);puff.scale.set(1.25,.48,.72);c.add(puff)}c.position.set((Math.random()-.5)*120,25+Math.random()*15,(Math.random()-.5)*105);c.scale.setScalar(.8+Math.random()*1.5);c.userData.drift=.2+Math.random()*.24;skyGroup.add(c);clouds.push(c)}
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(2.5,18,12),new THREE.MeshBasicMaterial({color:0xffe4a0}));sunDisc.position.set(-48,48,-72);skyGroup.add(sunDisc);
let cloudVisible=true,raining=false,raindrops=null;
function setRain(on){raining=on;if(raindrops){scene.remove(raindrops);raindrops.geometry.dispose();raindrops=null}if(on){const count=mobile?400:1100,geo=new THREE.BufferGeometry(),pos=new Float32Array(count*3);for(let i=0;i<count;i++){pos[i*3]=(Math.random()-.5)*100;pos[i*3+1]=Math.random()*38;pos[i*3+2]=(Math.random()-.5)*100}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));raindrops=new THREE.Points(geo,new THREE.PointsMaterial({color:0xd6edf5,size:.1,transparent:true,opacity:.7}));scene.add(raindrops);scene.background.set(0x718f9e);scene.fog.color.set(0x718f9e)}else{scene.background.set(0x91bfd1);scene.fog.color.set(0x91bfd1)}}
document.querySelector('#clouds').onclick=e=>{cloudVisible=!cloudVisible;skyGroup.visible=cloudVisible;e.currentTarget.textContent=cloudVisible?'☁ Clouds on':'☁ Clouds off';e.currentTarget.classList.toggle('active',cloudVisible)};
document.querySelector('#rain').onclick=()=>setRain(true);document.querySelector('#clear').onclick=()=>setRain(false);
document.querySelector('#reset').onclick=()=>{camera.position.set(38,34,43);controls.target.set(0,3,0);controls.update()};
document.querySelector('#toggle').onclick=()=>document.querySelector('#panel').classList.toggle('closed');
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;for(const c of clouds)c.position.x+=c.userData.drift*dt;if(raindrops){const p=raindrops.geometry.attributes.position;for(let i=0;i<p.count;i++){let y=p.getY(i)-dt*19;if(y<0)y=38;p.setY(i,y)}p.needsUpdate=true}controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.querySelector('#status').textContent='● LANDSCAPE READY';
</script></body></html>
